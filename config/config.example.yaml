# Example base configuration only. Copy to config/config.yaml for local use.
# The real config is ignored by Git and must never be committed.

# Reserved for the later HTTP/tunnel transport phase. Phase 7 still uses stdio.
server:
  host: "127.0.0.1"
  port: 8000

security:
  deny_by_default: true
  allow_arbitrary_shell: false

projects:
  example-project:
    # Must be an existing absolute directory. The canonicalized root remains
    # internal to the bridge and is never returned by MCP metadata.
    root: "C:/path/to/your/project"
    permissions:
      read: true
      search: true
      # Controlled process execution remains a separate high-trust capability.
      execute: false
      # Phase 7 Git is enabled through config/git.local.yaml, not by MCP input.
      # Keep this false in the base file; the trusted local Git overlay turns it
      # on only when a complete remote/branch policy is present.
      git: false

    # Generic process execution accepts either command aliases or, in your ignored
    # local config, a mapping from alias -> absolute executable path.
    # Git is deliberately NOT exposed through this generic executable surface.
    allowed_executables:
      - python
      - pytest
      - ruff

    execution:
      default_timeout_seconds: 60
      max_timeout_seconds: 300
      max_output_bytes: 262144
      max_concurrent_jobs: 1

# Phase 7 Git synchronization is configured separately:
#   Copy-Item config/git.example.yaml config/git.local.yaml
#
# The Git overlay pins one HTTPS remote URL and one branch per project. MCP callers
# can request only status, fetch, or clean fast-forward synchronization; they cannot
# provide arbitrary Git argv, URLs, refs, pushes, resets, cleans, checkouts, rebases,
# force operations, or history rewrites.
#
# Base policy remains fail-closed:
# - Project IDs address canonical local roots; roots may not overlap.
# - Permissions default to false; search=true requires read=true.
# - execute=true requires an explicit executable allowlist.
# - Shell executables and a generic shell(command) primitive remain unavailable.
# - Working directories are project-relative and protected by PathGuard.
# - Child execution receives a minimal environment and bounded time/output.
# - Generic Git execution is rejected when process execution is enabled.
# - If config/config.yaml is absent, the bridge starts with zero projects.
# - If the Git overlay is absent, dedicated Git synchronization stays disabled.
